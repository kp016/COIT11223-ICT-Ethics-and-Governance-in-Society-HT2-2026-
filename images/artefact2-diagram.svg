<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
    <rect width="800" height="420" fill="#f4f6f8"/>
    <text x="400" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">Act vs Rule Utilitarianism: the deactivation policy</text>

    <rect x="60" y="80" width="320" height="290" rx="10" fill="#ffffff" stroke="#2a9d8f" stroke-width="3"/>
    <text x="220" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2a9d8f">ACT: one decision</text>
    <circle cx="220" cy="175" r="34" fill="#2a9d8f"/>
    <text x="220" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#ffffff">1</text>
    <text x="220" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e3a5f">Deactivate this driver now</text>
    <text x="220" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e3a5f">Protects passengers fast</text>
    <text x="220" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e3a5f">Costs Uber almost nothing</text>
    <text x="220" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2a9d8f">Looks efficient</text>

    <rect x="420" y="80" width="320" height="290" rx="10" fill="#ffffff" stroke="#e76f51" stroke-width="3"/>
    <text x="580" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#e76f51">RULE: every driver</text>
    <circle cx="530" cy="175" r="18" fill="#e76f51"/>
    <circle cx="580" cy="175" r="18" fill="#e76f51"/>
    <circle cx="630" cy="175" r="18" fill="#e76f51"/>
    <text x="580" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e3a5f">Deactivate-first, appeal-never</text>
    <text x="580" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e3a5f">No unemployment insurance</text>
    <text x="580" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e3a5f">Income lost overnight</text>
    <text x="580" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#e76f51">Real harm at scale</text>
</svg>
