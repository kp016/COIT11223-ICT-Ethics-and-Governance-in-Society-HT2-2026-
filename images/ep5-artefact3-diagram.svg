<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="799" height="399" rx="12" fill="#fbfaf7" stroke="#e3e0d8"/>
  <text x="40" y="54" font-size="23" fill="#1f2328" font-weight="650" text-anchor="start">Who checks the checker?</text>
  <text x="40" y="80" font-size="13.5" fill="#5b616b" font-weight="400" text-anchor="start">The review of an automated system was itself written with an automated tool (Paoli 2025)</text>
  <rect x="40.0" y="108" width="160.5" height="104" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="54.0" y="132" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">THE SYSTEM</text>
  <text x="54.0" y="156" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Targeted</text>
  <text x="54.0" y="175" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Compliance</text>
  <text x="54.0" y="194" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Framework</text>
  <line x1="204.5" y1="160.0" x2="216.5" y2="160.0" stroke="#8a8f97" stroke-width="1.5"/>
  <path d="M215.5,156.0 L222.5,160.0 L215.5,164.0" fill="none" stroke="#8a8f97" stroke-width="1.5"/>
  <rect x="226.5" y="108" width="160.5" height="104" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="240.5" y="132" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">THE REVIEW</text>
  <text x="240.5" y="156" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Deloitte, 237 pages,</text>
  <text x="240.5" y="175" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">about A$440,000</text>
  <line x1="391.0" y1="160.0" x2="403.0" y2="160.0" stroke="#8a8f97" stroke-width="1.5"/>
  <path d="M402.0,156.0 L409.0,160.0 L402.0,164.0" fill="none" stroke="#8a8f97" stroke-width="1.5"/>
  <rect x="413.0" y="108" width="160.5" height="104" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="427.0" y="132" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">HOW IT WAS WRITTEN</text>
  <text x="427.0" y="156" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">With Azure OpenAI,</text>
  <text x="427.0" y="175" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">disclosed later</text>
  <line x1="577.5" y1="160.0" x2="589.5" y2="160.0" stroke="#8a8f97" stroke-width="1.5"/>
  <path d="M588.5,156.0 L595.5,160.0 L588.5,164.0" fill="none" stroke="#8a8f97" stroke-width="1.5"/>
  <rect x="599.5" y="108" width="160.5" height="104" rx="8" fill="#edf2f7" stroke="#2f5f8a" stroke-width="1"/>
  <text x="613.5" y="132" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">WHAT WAS FOUND</text>
  <text x="613.5" y="156" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Made-up references</text>
  <text x="613.5" y="175" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">and a made-up</text>
  <text x="613.5" y="194" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">court quote</text>
  <rect x="40" y="232" width="352" height="84" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="56" y="256" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">THE OUTCOME</text>
  <text x="56" y="280" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start">Corrected report published and</text>
  <text x="56" y="299" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start">Deloitte agreed to a partial refund.</text>
  <rect x="408" y="232" width="352" height="84" rx="8" fill="#edf2f7" stroke="#2f5f8a" stroke-width="1"/>
  <text x="424" y="256" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">SAME PATTERN IN MY OWN WORK</text>
  <text x="424" y="280" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start">An auto-draft flow wrote 20 emails with</text>
  <text x="424" y="299" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start">the wrong context. Only my check caught it.</text>
  <line x1="40" y1="338" x2="760" y2="338" stroke="#e3e0d8" stroke-width="1"/>
  <text x="40" y="360" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">Virtue ethics: what would an honest, careful professional do?  |  ACS 1.2.3 Honesty</text>
  <text x="40" y="378" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">My rule: AI can help me draft, but I read everything before it goes anywhere.</text>
</svg>
