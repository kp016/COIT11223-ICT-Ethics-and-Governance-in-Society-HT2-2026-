<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="460" fill="#06182f"/>
  <rect x="0" y="0" width="800" height="6" fill="#38bdf8"/>

  <text x="56" y="62" fill="#ffffff" font-size="27" font-weight="700">eSafety Commissioner v X Corp</text>
  <text x="56" y="88" fill="#7d9bbd" font-size="14">How far does one country's takedown order reach?</text>

  <!-- globe -->
  <g transform="translate(212,268)">
    <circle r="118" fill="#0d2c52" stroke="#1d4b82" stroke-width="2"/>
    <ellipse rx="118" ry="40" fill="none" stroke="#1d4b82" stroke-width="1.5"/>
    <ellipse rx="118" ry="82" fill="none" stroke="#1d4b82" stroke-width="1.5"/>
    <ellipse rx="40" ry="118" fill="none" stroke="#1d4b82" stroke-width="1.5"/>
    <ellipse rx="82" ry="118" fill="none" stroke="#1d4b82" stroke-width="1.5"/>
    <line x1="-118" y1="0" x2="118" y2="0" stroke="#1d4b82" stroke-width="1.5"/>
    <line x1="0" y1="-118" x2="0" y2="118" stroke="#1d4b82" stroke-width="1.5"/>
    <circle cx="46" cy="58" r="21" fill="#38bdf8"/>
    <text x="46" y="63" text-anchor="middle" fill="#06182f" font-size="12" font-weight="700">AU</text>
  </g>
  <text x="212" y="424" text-anchor="middle" fill="#7d9bbd" font-size="12.5">Only the blue area was ordered dark</text>

  <!-- right column -->
  <text x="420" y="152" fill="#5f7ea1" font-size="12" letter-spacing="1.5">THE MATERIAL</text>
  <text x="420" y="182" fill="#ffffff" font-size="22" font-weight="700">65 links</text>
  <text x="420" y="204" fill="#7d9bbd" font-size="13">to graphic stabbing footage</text>

  <rect x="420" y="232" width="324" height="70" rx="6" fill="#2a1420" stroke="#8b2f4a" stroke-width="2"/>
  <text x="444" y="258" fill="#ff7597" font-size="13" font-weight="700">SOUGHT: removed everywhere on earth</text>
  <text x="444" y="280" fill="#d69ab0" font-size="12.5">Refused. Comity between nations.</text>
  <line x1="432" y1="246" x2="432" y2="288" stroke="#8b2f4a" stroke-width="4"/>

  <rect x="420" y="314" width="324" height="70" rx="6" fill="#0b2f45" stroke="#38bdf8" stroke-width="2"/>
  <text x="444" y="340" fill="#7dd3fc" font-size="13" font-weight="700">ORDERED: geo-blocked for Australia</text>
  <text x="444" y="362" fill="#a7cbe3" font-size="12.5">Held to be "all reasonable steps"</text>
  <line x1="432" y1="328" x2="432" y2="370" stroke="#38bdf8" stroke-width="4"/>

  <text x="420" y="424" fill="#ffffff" font-size="14.5" font-weight="700">Censorship runs into borders before it runs into ethics.</text>
</svg>
