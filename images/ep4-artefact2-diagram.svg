<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="460" fill="#f4f6f8"/>
  <text x="400" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">eSafety v X: whose internet is it?</text>

  <!-- Left: Australia only, accepted -->
  <g transform="translate(110,80)">
    <circle cx="90" cy="90" r="90" fill="#2a9d8f"/>
    <text x="90" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Australia</text>
    <text x="90" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f0fdfa">geo-blocked</text>
    <text x="90" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">Ruled sufficient</text>
    <text x="90" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#3d5a73">"all reasonable steps"</text>
  </g>

  <text x="400" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#94a3b8">vs</text>

  <!-- Right: whole globe, rejected -->
  <g transform="translate(500,80)">
    <circle cx="90" cy="90" r="90" fill="#e76f51" opacity="0.9"/>
    <ellipse cx="90" cy="90" rx="90" ry="35" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="90" y1="0" x2="90" y2="180" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <text x="90" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Every country</text>
    <text x="90" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff1ee">global takedown sought</text>
    <text x="90" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">Rejected</text>
    <text x="90" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#3d5a73">by the Federal Court</text>
  </g>

  <rect x="80" y="360" width="640" height="60" rx="8" fill="#1e3a5f"/>
  <text x="400" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">No single country gets to decide what the rest of the world's</text>
  <text x="400" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">internet users are allowed to see</text>
</svg>
