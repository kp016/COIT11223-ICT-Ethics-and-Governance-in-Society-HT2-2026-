<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="460" fill="#0a0a0c"/>
  <rect x="0" y="0" width="800" height="6" fill="#c81e30"/>
  <text x="56" y="62" fill="#ffffff" font-size="27" font-weight="700">An algorithm that decided who eats</text>
  <text x="56" y="88" fill="#8a8a94" font-size="14">Samagra Vedika, Telangana, India (Tapasya, Sambhav &amp; Joshi 2024)</text>
  <text x="168" y="190" text-anchor="middle" fill="#c81e30" font-size="62" font-weight="700">1.86M</text>
  <text x="168" y="217" text-anchor="middle" fill="#8a8a94" font-size="13" font-weight="400" letter-spacing="1">FOOD CARDS CANCELLED</text>
  <text x="168" y="236" text-anchor="middle" fill="#6a6a74" font-size="11.5" font-weight="400">2014 to 2019</text>
  <text x="400" y="190" text-anchor="middle" fill="#ffffff" font-size="62" font-weight="700">30</text>
  <text x="400" y="217" text-anchor="middle" fill="#8a8a94" font-size="13" font-weight="400" letter-spacing="1">DATABASES MERGED</text>
  <text x="400" y="236" text-anchor="middle" fill="#6a6a74" font-size="11.5" font-weight="400">into one family profile</text>
  <text x="632" y="190" text-anchor="middle" fill="#ffffff" font-size="62" font-weight="700">7.5%+</text>
  <text x="632" y="217" text-anchor="middle" fill="#8a8a94" font-size="13" font-weight="400" letter-spacing="1">WRONGLY REJECTED</text>
  <text x="632" y="236" text-anchor="middle" fill="#6a6a74" font-size="11.5" font-weight="400">found on court-ordered re-check</text>
  <line x1="284" y1="130" x2="284" y2="240" stroke="#2a2a32"/>
  <line x1="516" y1="130" x2="516" y2="240" stroke="#2a2a32"/>
  <text x="56" y="290" text-anchor="start" fill="#8a8a94" font-size="12" font-weight="700" letter-spacing="1.5">ONE FAMILY'S RECORD</text>
  <rect x="56" y="304" width="160" height="62" rx="4" fill="#16161b" stroke="#2a2a32"/>
  <text x="70" y="330" text-anchor="start" fill="#ffffff" font-size="13" font-weight="700">Bismillah Bee,</text>
  <text x="70" y="350" text-anchor="start" fill="#ffffff" font-size="13" font-weight="700">67, widow</text>
  <text x="224" y="340" text-anchor="middle" fill="#c81e30" font-size="18" font-weight="700">→</text>
  <rect x="232" y="304" width="160" height="62" rx="4" fill="#16161b" stroke="#2a2a32"/>
  <text x="246" y="330" text-anchor="start" fill="#ffffff" font-size="13" font-weight="700">Late husband matched</text>
  <text x="246" y="350" text-anchor="start" fill="#ffffff" font-size="13" font-weight="700">to a different man</text>
  <text x="400" y="340" text-anchor="middle" fill="#c81e30" font-size="18" font-weight="700">→</text>
  <rect x="408" y="304" width="160" height="62" rx="4" fill="#16161b" stroke="#2a2a32"/>
  <text x="422" y="330" text-anchor="start" fill="#ffffff" font-size="13" font-weight="700">Tagged as</text>
  <text x="422" y="350" text-anchor="start" fill="#ffffff" font-size="13" font-weight="700">“car owner”</text>
  <text x="576" y="340" text-anchor="middle" fill="#c81e30" font-size="18" font-weight="700">→</text>
  <rect x="584" y="304" width="160" height="62" rx="4" fill="#16161b" stroke="#c81e30"/>
  <text x="598" y="330" text-anchor="start" fill="#c81e30" font-size="13" font-weight="700">Food rations</text>
  <text x="598" y="350" text-anchor="start" fill="#c81e30" font-size="13" font-weight="700">denied</text>
  <text x="56" y="412" text-anchor="start" fill="#8a8a94" font-size="12.5" font-weight="400">Rule utilitarianism: “cut first, prove later” vs “notice and a human check before anyone loses food”</text>
  <text x="56" y="440" text-anchor="start" fill="#6a6a74" font-size="12" font-weight="400">ACS 1.2.1: the public interest comes before cost savings</text>
</svg>
