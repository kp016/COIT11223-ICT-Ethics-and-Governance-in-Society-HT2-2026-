<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="799" height="449" rx="12" fill="#fbfaf7" stroke="#e3e0d8"/>
  <text x="40" y="54" font-size="23" fill="#1f2328" font-weight="650" text-anchor="start">An algorithm that decided who eats</text>
  <text x="40" y="80" font-size="13.5" fill="#5b616b" font-weight="400" text-anchor="start">Samagra Vedika, Telangana, India (Tapasya, Sambhav &amp; Joshi 2024)</text>
  <rect x="40.0" y="104" width="229.33333333333334" height="100" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="56.0" y="146" font-size="28" fill="#2f5f8a" font-weight="650" text-anchor="start">1.86M+</text>
  <text x="56.0" y="170" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">food security cards</text>
  <text x="56.0" y="187" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">cancelled, 2014 to 2019</text>
  <rect x="285.33333333333337" y="104" width="229.33333333333334" height="100" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="301.33333333333337" y="146" font-size="28" fill="#2f5f8a" font-weight="650" text-anchor="start">Up to 30</text>
  <text x="301.33333333333337" y="170" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">databases merged into</text>
  <text x="301.33333333333337" y="187" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">one family profile</text>
  <rect x="530.6666666666667" y="104" width="229.33333333333334" height="100" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="546.6666666666667" y="146" font-size="28" fill="#2f5f8a" font-weight="650" text-anchor="start">7.5%+</text>
  <text x="546.6666666666667" y="170" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">of rejections overturned</text>
  <text x="546.6666666666667" y="187" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">on court-ordered re-check</text>
  <text x="40" y="238" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">ONE FAMILY'S RECORD</text>
  <rect x="40.0" y="252" width="160.5" height="100" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="54.0" y="276" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">WHO</text>
  <text x="54.0" y="300" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Bismillah Bee,</text>
  <text x="54.0" y="319" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">67, widow</text>
  <line x1="204.5" y1="302.0" x2="216.5" y2="302.0" stroke="#8a8f97" stroke-width="1.5"/>
  <path d="M215.5,298.0 L222.5,302.0 L215.5,306.0" fill="none" stroke="#8a8f97" stroke-width="1.5"/>
  <rect x="226.5" y="252" width="160.5" height="100" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="240.5" y="276" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">THE MISMATCH</text>
  <text x="240.5" y="300" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Her late husband</text>
  <text x="240.5" y="319" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">was matched to a</text>
  <text x="240.5" y="338" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">different man</text>
  <line x1="391.0" y1="302.0" x2="403.0" y2="302.0" stroke="#8a8f97" stroke-width="1.5"/>
  <path d="M402.0,298.0 L409.0,302.0 L402.0,306.0" fill="none" stroke="#8a8f97" stroke-width="1.5"/>
  <rect x="413.0" y="252" width="160.5" height="100" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="427.0" y="276" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">THE TAG</text>
  <text x="427.0" y="300" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">That man</text>
  <text x="427.0" y="319" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">owned a car</text>
  <line x1="577.5" y1="302.0" x2="589.5" y2="302.0" stroke="#8a8f97" stroke-width="1.5"/>
  <path d="M588.5,298.0 L595.5,302.0 L588.5,306.0" fill="none" stroke="#8a8f97" stroke-width="1.5"/>
  <rect x="599.5" y="252" width="160.5" height="100" rx="8" fill="#edf2f7" stroke="#2f5f8a" stroke-width="1"/>
  <text x="613.5" y="276" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">THE RESULT</text>
  <text x="613.5" y="300" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Her food rations</text>
  <text x="613.5" y="319" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">were cut</text>
  <line x1="40" y1="390" x2="760" y2="390" stroke="#e3e0d8" stroke-width="1"/>
  <text x="40" y="412" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">Rule utilitarianism: "cut first, prove later" vs notice and a human check before anyone loses food</text>
  <text x="40" y="430" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">ACS 1.2.1: the public interest comes before cost savings</text>
</svg>
