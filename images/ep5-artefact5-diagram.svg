<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="460" fill="#0a0a0c"/>
  <rect x="0" y="0" width="800" height="6" fill="#c81e30"/>
  <text x="56" y="62" fill="#ffffff" font-size="27" font-weight="700">Seven years to see the code</text>
  <text x="56" y="88" fill="#8a8a94" font-size="14">Spain's BOSCO, the program deciding who gets the electricity discount (Civio 2025)</text>
  <text x="56" y="200" text-anchor="start" fill="#c81e30" font-size="96" font-weight="700">7</text>
  <text x="56" y="228" text-anchor="start" fill="#8a8a94" font-size="13" font-weight="400" letter-spacing="1">YEARS OF REFUSAL</text>
  <text x="250" y="150" text-anchor="start" fill="#8a8a94" font-size="13" font-weight="700">Government's reasons for secrecy</text>
  <text x="250" y="178" text-anchor="start" fill="#ffffff" font-size="17" font-weight="700">National security</text>
  <text x="250" y="202" text-anchor="start" fill="#ffffff" font-size="17" font-weight="700">Intellectual property</text>
  <text x="250" y="236" text-anchor="start" fill="#c81e30" font-size="13.5" font-weight="700">Court: “unnoticed vulnerabilities” are found through scrutiny</text>
  <rect x="56" y="282" width="688" height="8" rx="4" fill="#2a2a32"/>
  <rect x="56" y="282" width="688" height="8" rx="4" fill="#c81e30" opacity="0.35"/>
  <circle cx="70" cy="286" r="7" fill="#ffffff"/>
  <text x="70" y="318" text-anchor="start" fill="#c9c9d1" font-size="12.5" font-weight="700">2018</text>
  <text x="70" y="336" text-anchor="start" fill="#6a6a74" font-size="11.5" font-weight="400">Civio requests</text>
  <text x="70" y="352" text-anchor="start" fill="#6a6a74" font-size="11.5" font-weight="400">the source code</text>
  <circle cx="230" cy="286" r="7" fill="#c9c9d1"/>
  <text x="230" y="318" text-anchor="start" fill="#c9c9d1" font-size="12.5" font-weight="700">2019</text>
  <text x="230" y="336" text-anchor="start" fill="#6a6a74" font-size="11.5" font-weight="400">Docs given,</text>
  <text x="230" y="352" text-anchor="start" fill="#6a6a74" font-size="11.5" font-weight="400">code refused</text>
  <circle cx="390" cy="286" r="7" fill="#c9c9d1"/>
  <text x="390" y="318" text-anchor="start" fill="#c9c9d1" font-size="12.5" font-weight="700">2021</text>
  <text x="390" y="336" text-anchor="start" fill="#6a6a74" font-size="11.5" font-weight="400">First court</text>
  <text x="390" y="352" text-anchor="start" fill="#6a6a74" font-size="11.5" font-weight="400">says no</text>
  <circle cx="550" cy="286" r="7" fill="#c9c9d1"/>
  <text x="550" y="318" text-anchor="start" fill="#c9c9d1" font-size="12.5" font-weight="700">2024</text>
  <text x="550" y="336" text-anchor="start" fill="#6a6a74" font-size="11.5" font-weight="400">National court</text>
  <text x="550" y="352" text-anchor="start" fill="#6a6a74" font-size="11.5" font-weight="400">says no</text>
  <circle cx="730" cy="286" r="7" fill="#c81e30"/>
  <text x="730" y="318" text-anchor="end" fill="#c9c9d1" font-size="12.5" font-weight="700">Sep 2025</text>
  <text x="730" y="336" text-anchor="end" fill="#6a6a74" font-size="11.5" font-weight="400">Supreme Court</text>
  <text x="730" y="352" text-anchor="end" fill="#6a6a74" font-size="11.5" font-weight="400">orders release</text>
  <line x1="56" y1="384" x2="744" y2="384" stroke="#2a2a32"/>
  <text x="56" y="414" text-anchor="start" fill="#8a8a94" font-size="13" font-weight="400">Rule utilitarianism: a general rule that public decision code is open to scrutiny</text>
  <text x="56" y="434" text-anchor="start" fill="#8a8a94" font-size="13" font-weight="400">catches errors before they reach thousands of people. Same logic as vulnerability disclosure.</text>
</svg>
