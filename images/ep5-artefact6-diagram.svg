<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="460" fill="#0a0a0c"/>
  <rect x="0" y="0" width="800" height="6" fill="#c81e30"/>
  <text x="56" y="62" fill="#ffffff" font-size="27" font-weight="700">When the decision is about who lives</text>
  <text x="56" y="88" fill="#8a8a94" font-size="14">Lavender, as reported by +972 Magazine and Democracy Now! (Abraham 2024)</text>
  <text x="168" y="196" text-anchor="middle" fill="#c81e30" font-size="58" font-weight="700">37,000</text>
  <text x="168" y="223" text-anchor="middle" fill="#8a8a94" font-size="13" font-weight="400" letter-spacing="1">PEOPLE MARKED, AT MOST</text>
  <text x="400" y="196" text-anchor="middle" fill="#ffffff" font-size="58" font-weight="700">~10%</text>
  <text x="400" y="223" text-anchor="middle" fill="#8a8a94" font-size="13" font-weight="400" letter-spacing="1">ERRORS, PER SOURCES</text>
  <text x="632" y="196" text-anchor="middle" fill="#ffffff" font-size="58" font-weight="700">~20 sec</text>
  <text x="632" y="223" text-anchor="middle" fill="#8a8a94" font-size="13" font-weight="400" letter-spacing="1">HUMAN REVIEW PER TARGET</text>
  <line x1="284" y1="130" x2="284" y2="230" stroke="#2a2a32"/>
  <line x1="516" y1="130" x2="516" y2="230" stroke="#2a2a32"/>
  <rect x="56" y="262" width="330" height="96" rx="4" fill="#16161b" stroke="#2a2a32"/>
  <text x="76" y="290" text-anchor="start" fill="#c81e30" font-size="11" font-weight="700" letter-spacing="1">ACT UTILITARIANISM AS A SETTING</text>
  <text x="76" y="316" text-anchor="start" fill="#ffffff" font-size="13.5" font-weight="400">Sources described an accepted number</text>
  <text x="76" y="336" text-anchor="start" fill="#ffffff" font-size="13.5" font-weight="400">of civilian deaths per target</text>
  <rect x="414" y="262" width="330" height="96" rx="4" fill="#16161b" stroke="#2a2a32"/>
  <text x="434" y="290" text-anchor="start" fill="#8a8a94" font-size="11" font-weight="700" letter-spacing="1">KANT'S ANSWER</text>
  <text x="434" y="316" text-anchor="start" fill="#ffffff" font-size="13.5" font-weight="400">No person can be a number in</text>
  <text x="434" y="336" text-anchor="start" fill="#ffffff" font-size="13.5" font-weight="400">someone else's calculation</text>
  <text x="56" y="396" text-anchor="start" fill="#ffffff" font-size="17" font-weight="700">20 seconds is not meaningful human control. It is automation bias.</text>
  <text x="56" y="426" text-anchor="start" fill="#6a6a74" font-size="12" font-weight="400">Claims come from six anonymous intelligence officers. The Israeli military denies using AI</text>
  <text x="56" y="443" text-anchor="start" fill="#6a6a74" font-size="12" font-weight="400">to identify targets and says its systems are tools that assist analysts.</text>
</svg>
