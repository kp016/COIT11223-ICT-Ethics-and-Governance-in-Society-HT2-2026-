<svg viewBox="0 0 800 456" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="799" height="455" rx="12" fill="#fbfaf7" stroke="#e3e0d8"/>
  <text x="40" y="54" font-size="23" fill="#1f2328" font-weight="650" text-anchor="start">The law changed one word. The code did not.</text>
  <text x="40" y="80" font-size="13.5" fill="#5b616b" font-weight="400" text-anchor="start">Targeted Compliance Framework, Australia (Truu 2025)</text>
  <rect x="40" y="104" width="720" height="70" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="60" y="128" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">THE LEGAL CHANGE AFTER ROBODEBT</text>
  <text x="60" y="156" font-size="20" fill="#8a8f97" font-weight="500" text-anchor="start" text-decoration="line-through">"must cancel"</text>
  <line x1="222" y1="150" x2="266" y2="150" stroke="#8a8f97" stroke-width="1.5"/>
  <path d="M265,146 L272,150 L265,154" fill="none" stroke="#8a8f97" stroke-width="1.5"/>
  <text x="286" y="156" font-size="20" fill="#2f5f8a" font-weight="650" text-anchor="start">"may cancel"</text>
  <text x="450" y="148" font-size="13" fill="#5b616b" font-weight="400" text-anchor="start">A person now has to consider</text>
  <text x="450" y="166" font-size="13" fill="#5b616b" font-weight="400" text-anchor="start">each jobseeker's situation first</text>
  <rect x="40.0" y="192" width="229.33333333333334" height="100" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="56.0" y="234" font-size="28" fill="#2f5f8a" font-weight="650" text-anchor="start">964</text>
  <text x="56.0" y="258" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">payments cancelled</text>
  <text x="56.0" y="275" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">automatically</text>
  <rect x="285.33333333333337" y="192" width="229.33333333333334" height="100" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="301.33333333333337" y="234" font-size="28" fill="#2f5f8a" font-weight="650" text-anchor="start">27 months</text>
  <text x="301.33333333333337" y="258" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">of unlawful cancellations,</text>
  <text x="301.33333333333337" y="275" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">April 2022 to July 2024</text>
  <rect x="530.6666666666667" y="192" width="229.33333333333334" height="100" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="546.6666666666667" y="234" font-size="28" fill="#2f5f8a" font-weight="650" text-anchor="start">1 word</text>
  <text x="546.6666666666667" y="258" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">changed in the law,</text>
  <text x="546.6666666666667" y="275" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">never in the code</text>
  <line x1="70" y1="348" x2="730" y2="348" stroke="#e3e0d8" stroke-width="2"/>
  <circle cx="70" cy="348" r="6" fill="#2f5f8a" stroke="none"/>
  <text x="70" y="332" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="start">April 2022</text>
  <text x="70" y="374" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">New law: a human must</text>
  <text x="70" y="391" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">consider each case</text>
  <circle cx="400" cy="348" r="6" fill="#2f5f8a" stroke="none"/>
  <text x="400" y="332" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">2022 to 2024</text>
  <text x="400" y="374" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="middle">The system keeps</text>
  <text x="400" y="391" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="middle">cancelling on its own</text>
  <circle cx="730" cy="348" r="6" fill="#2f5f8a" stroke="none"/>
  <text x="730" y="332" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="end">August 2025</text>
  <text x="730" y="374" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="end">Ombudsman finds the</text>
  <text x="730" y="391" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="end">cancellations unlawful</text>
  <line x1="40" y1="412" x2="760" y2="412" stroke="#e3e0d8" stroke-width="1"/>
  <text x="40" y="434" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">ACS 1.2.4 Competence: adequate care and skill were not applied  |  Social contract: only one side was held to the deal</text>
</svg>
