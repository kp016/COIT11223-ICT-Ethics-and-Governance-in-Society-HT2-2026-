<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="460" fill="#0a0a0c"/>
  <rect x="0" y="0" width="800" height="6" fill="#c81e30"/>
  <text x="56" y="62" fill="#ffffff" font-size="27" font-weight="700">Same technology, three different problems</text>
  <text x="56" y="88" fill="#8a8a94" font-size="14">How the US, EU and China frame public sector ADM (Mark &amp; Morison 2025)</text>
  <rect x="56" y="122" width="216" height="200" rx="4" fill="#16161b" stroke="#2a2a32"/>
  <text x="76" y="156" text-anchor="start" fill="#8a8a94" font-size="13" font-weight="700" letter-spacing="2">US</text>
  <text x="76" y="192" text-anchor="start" fill="#ffffff" font-size="21" font-weight="700">“Innovation gap”</text>
  <text x="76" y="224" text-anchor="start" fill="#c9c9d1" font-size="13" font-weight="400">Fear of falling behind,</text>
  <text x="76" y="243" text-anchor="start" fill="#c9c9d1" font-size="13" font-weight="400">so regulation is a cost</text>
  <line x1="76" y1="268" x2="252" y2="268" stroke="#2a2a32"/>
  <text x="76" y="296" text-anchor="start" fill="#6a6a74" font-size="11.5" font-weight="400">My Week 4 match:</text>
  <text x="76" y="313" text-anchor="start" fill="#c81e30" font-size="13" font-weight="700">Act utilitarianism</text>
  <rect x="292" y="122" width="216" height="200" rx="4" fill="#16161b" stroke="#2a2a32"/>
  <text x="312" y="156" text-anchor="start" fill="#8a8a94" font-size="13" font-weight="700" letter-spacing="2">EU</text>
  <text x="312" y="192" text-anchor="start" fill="#ffffff" font-size="21" font-weight="700">“Trust deficit”</text>
  <text x="312" y="224" text-anchor="start" fill="#c9c9d1" font-size="13" font-weight="400">Citizens must trust the</text>
  <text x="312" y="243" text-anchor="start" fill="#c9c9d1" font-size="13" font-weight="400">system before it scales</text>
  <line x1="312" y1="268" x2="488" y2="268" stroke="#2a2a32"/>
  <text x="312" y="296" text-anchor="start" fill="#6a6a74" font-size="11.5" font-weight="400">My Week 4 match:</text>
  <text x="312" y="313" text-anchor="start" fill="#c81e30" font-size="13" font-weight="700">Kantianism</text>
  <rect x="528" y="122" width="216" height="200" rx="4" fill="#16161b" stroke="#2a2a32"/>
  <text x="548" y="156" text-anchor="start" fill="#8a8a94" font-size="13" font-weight="700" letter-spacing="2">CHINA</text>
  <text x="548" y="192" text-anchor="start" fill="#ffffff" font-size="21" font-weight="700">“Stability risk”</text>
  <text x="548" y="224" text-anchor="start" fill="#c9c9d1" font-size="13" font-weight="400">ADM serves order and</text>
  <text x="548" y="243" text-anchor="start" fill="#c9c9d1" font-size="13" font-weight="400">state control</text>
  <line x1="548" y1="268" x2="724" y2="268" stroke="#2a2a32"/>
  <text x="548" y="296" text-anchor="start" fill="#6a6a74" font-size="11.5" font-weight="400">My Week 4 match:</text>
  <text x="548" y="313" text-anchor="start" fill="#c81e30" font-size="13" font-weight="700">Social contract</text>
  <rect x="56" y="350" width="688" height="62" rx="4" fill="#c81e30"/>
  <text x="400" y="377" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="400" letter-spacing="1">Where all three are heading</text>
  <text x="400" y="399" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Innovation is moving ahead of accountability</text>
  <text x="56" y="440" text-anchor="start" fill="#6a6a74" font-size="12" font-weight="400">ADM = any system where decision-making authority is partly or fully delegated to algorithms</text>
</svg>
