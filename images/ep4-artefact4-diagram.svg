<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="460" fill="#04241a"/>
  <rect x="0" y="0" width="800" height="6" fill="#22c55e"/>

  <text x="56" y="60" fill="#ffffff" font-size="27" font-weight="700">Who should be holding the switch?</text>
  <text x="56" y="86" fill="#7fb69a" font-size="14">Cloudflare moved on reputation, not on belief</text>

  <line x1="400" y1="112" x2="400" y2="372" stroke="#0d4a34" stroke-width="2"/>

  <!-- LEFT: single owner -->
  <text x="56" y="136" fill="#f0a05a" font-size="12" letter-spacing="1.5">TODAY</text>
  <circle cx="150" cy="218" r="52" fill="#3a2410" stroke="#f0a05a" stroke-width="3"/>
  <text x="150" y="214" text-anchor="middle" fill="#ffd9ad" font-size="13" font-weight="700">ONE</text>
  <text x="150" y="232" text-anchor="middle" fill="#ffd9ad" font-size="13" font-weight="700">OWNER</text>

  <rect x="228" y="196" width="60" height="44" rx="22" fill="#f0a05a"/>
  <circle cx="266" cy="218" r="16" fill="#04241a"/>
  <text x="258" y="266" text-anchor="middle" fill="#c58a4e" font-size="11.5">flipped once the</text>
  <text x="258" y="282" text-anchor="middle" fill="#c58a4e" font-size="11.5">link went public</text>

  <text x="56" y="322" fill="#ffffff" font-size="13.5" font-weight="700">One point of decision</text>
  <text x="56" y="342" fill="#8fbfa8" font-size="12.5">If it is corrupt or exposed,</text>
  <text x="56" y="359" fill="#8fbfa8" font-size="12.5">every call inherits that.</text>

  <!-- RIGHT: consortium -->
  <text x="440" y="136" fill="#4ade80" font-size="12" letter-spacing="1.5">THE ALTERNATIVE</text>

  <g stroke="#1c7a4f" stroke-width="2">
    <line x1="600" y1="160" x2="524" y2="216"/>
    <line x1="600" y1="160" x2="676" y2="216"/>
    <line x1="524" y1="216" x2="553" y2="292"/>
    <line x1="676" y1="216" x2="647" y2="292"/>
    <line x1="553" y1="292" x2="647" y2="292"/>
    <line x1="600" y1="160" x2="553" y2="292"/>
    <line x1="600" y1="160" x2="647" y2="292"/>
    <line x1="524" y1="216" x2="647" y2="292"/>
    <line x1="676" y1="216" x2="553" y2="292"/>
    <line x1="524" y1="216" x2="676" y2="216"/>
  </g>
  <circle cx="600" cy="160" r="22" fill="#14532d" stroke="#4ade80" stroke-width="2.5"/>
  <circle cx="524" cy="216" r="22" fill="#14532d" stroke="#4ade80" stroke-width="2.5"/>
  <circle cx="676" cy="216" r="22" fill="#14532d" stroke="#4ade80" stroke-width="2.5"/>
  <circle cx="553" cy="292" r="22" fill="#14532d" stroke="#4ade80" stroke-width="2.5"/>
  <circle cx="647" cy="292" r="22" fill="#14532d" stroke="#4ade80" stroke-width="2.5"/>

  <text x="440" y="322" fill="#ffffff" font-size="13.5" font-weight="700">Consortium blockchain</text>
  <text x="440" y="342" fill="#8fbfa8" font-size="12.5">Independent members, different</text>
  <text x="440" y="359" fill="#8fbfa8" font-size="12.5">ideologies, one shared ledger.</text>

  <rect x="440" y="374" width="188" height="26" rx="13" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="534" y="392" text-anchor="middle" fill="#4ade80" font-size="12.5" font-weight="700">no takedown without quorum</text>

  <text x="56" y="437" fill="#ffffff" font-size="14.5" font-weight="700">The fix is not a better owner. It is not having a single one.</text>
</svg>
