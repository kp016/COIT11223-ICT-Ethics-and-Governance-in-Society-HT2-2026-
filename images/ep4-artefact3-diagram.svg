<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="460" fill="#2a0a0d"/>
  <rect x="0" y="0" width="800" height="6" fill="#ef4444"/>

  <text x="56" y="60" fill="#ffffff" font-size="27" font-weight="700">One app said yes. The posts stayed up.</text>
  <text x="56" y="86" fill="#c98a90" font-size="14">Bluesky, Turkey, and the limits of a single takedown</text>

  <!-- demand -->
  <rect x="56" y="112" width="322" height="58" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="76" y="138" fill="#ffffff" font-size="14" font-weight="700">Government demand</text>
  <text x="76" y="158" fill="#f3b5b5" font-size="12.5">restrict ~60 accounts, national security</text>

  <path d="M217 170 L217 196 L217 206" stroke="#ef4444" stroke-width="3" fill="none"/>
  <polygon points="217,216 209,198 225,198" fill="#ef4444"/>

  <!-- complying app -->
  <rect x="56" y="222" width="322" height="76" rx="6" fill="#3d1416" stroke="#8a4145" stroke-width="2"/>
  <text x="76" y="250" fill="#ffb4b4" font-size="14" font-weight="700">The official app complied</text>
  <text x="76" y="271" fill="#b98a8c" font-size="12.5">country filter applied</text>
  <text x="76" y="289" fill="#b98a8c" font-size="12.5">accounts hidden for users in Turkey</text>

  <!-- other apps -->
  <rect x="418" y="222" width="326" height="76" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="438" y="250" fill="#86efac" font-size="14" font-weight="700">Other apps, same protocol</text>
  <text x="438" y="271" fill="#b7e4c7" font-size="12.5">never applied that filter</text>
  <text x="438" y="289" fill="#b7e4c7" font-size="12.5">the same accounts stayed visible</text>

  <!-- protocol bar -->
  <rect x="56" y="326" width="688" height="52" rx="6" fill="#451a1d" stroke="#a15257" stroke-width="2"/>
  <text x="400" y="348" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">THE OPEN PROTOCOL</text>
  <text x="400" y="368" text-anchor="middle" fill="#d3a3a6" font-size="12.5">where the posts actually live, untouched by either decision</text>

  <line x1="217" y1="298" x2="217" y2="326" stroke="#a15257" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="581" y1="298" x2="581" y2="326" stroke="#a15257" stroke-width="2" stroke-dasharray="4 4"/>

  <text x="56" y="416" fill="#ffffff" font-size="15" font-weight="700">Decentralising did not stop the pressure.</text>
  <text x="56" y="437" fill="#c98a90" font-size="13">It stopped one company's yes from being the end of the matter.</text>
</svg>
