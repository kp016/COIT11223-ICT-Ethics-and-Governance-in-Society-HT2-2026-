<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="460" fill="#0a0a0c"/>
  <rect x="0" y="0" width="800" height="6" fill="#c81e30"/>
  <text x="56" y="62" fill="#ffffff" font-size="27" font-weight="700">From a person to a budget</text>
  <text x="56" y="88" fill="#8a8a94" font-size="14">NDIS needs assessments from mid-2026 (Van Toorn &amp; Dickinson 2025)</text>
  <rect x="56" y="122" width="160" height="110" rx="4" fill="#16161b" stroke="#2a2a32"/>
  <text x="70" y="150" text-anchor="start" fill="#8a8a94" font-size="10" font-weight="700" letter-spacing="1">THE PERSON</text>
  <text x="70" y="186" text-anchor="start" fill="#ffffff" font-size="14" font-weight="700">Needs support</text>
  <text x="70" y="206" text-anchor="start" fill="#ffffff" font-size="14" font-weight="700">for daily life</text>
  <text x="224" y="184" text-anchor="middle" fill="#c81e30" font-size="18" font-weight="700">→</text>
  <rect x="232" y="122" width="160" height="110" rx="4" fill="#16161b" stroke="#2a2a32"/>
  <text x="246" y="150" text-anchor="start" fill="#8a8a94" font-size="10" font-weight="700" letter-spacing="1">ASSESSMENT</text>
  <text x="246" y="186" text-anchor="start" fill="#ffffff" font-size="14" font-weight="700">3-hour interview,</text>
  <text x="246" y="206" text-anchor="start" fill="#ffffff" font-size="14" font-weight="700">self-reported</text>
  <text x="400" y="184" text-anchor="middle" fill="#c81e30" font-size="18" font-weight="700">→</text>
  <rect x="408" y="122" width="160" height="110" rx="4" fill="#16161b" stroke="#2a2a32"/>
  <text x="422" y="150" text-anchor="start" fill="#8a8a94" font-size="10" font-weight="700" letter-spacing="1">I-CAN TOOL</text>
  <text x="422" y="186" text-anchor="start" fill="#ffffff" font-size="14" font-weight="700">Scores 12 areas</text>
  <text x="422" y="206" text-anchor="start" fill="#ffffff" font-size="14" font-weight="700">of daily life</text>
  <text x="576" y="184" text-anchor="middle" fill="#c81e30" font-size="18" font-weight="700">→</text>
  <rect x="584" y="122" width="160" height="110" rx="4" fill="#16161b" stroke="#c81e30" stroke-dasharray="6 5"/>
  <text x="598" y="150" text-anchor="start" fill="#8a8a94" font-size="10" font-weight="700" letter-spacing="1">THE BUDGET</text>
  <text x="598" y="186" text-anchor="start" fill="#c81e30" font-size="14" font-weight="700">Set by a process</text>
  <text x="598" y="206" text-anchor="start" fill="#c81e30" font-size="14" font-weight="700">not made public</text>
  <text x="56" y="322" text-anchor="start" fill="#c81e30" font-size="76" font-weight="700">73%</text>
  <text x="250" y="270" text-anchor="start" fill="#ffffff" font-size="15" font-weight="400">of 7,132 appeals against NDIA decisions in the</text>
  <text x="250" y="292" text-anchor="start" fill="#ffffff" font-size="15" font-weight="400">year to June 2025 changed the decision</text>
  <text x="250" y="322" text-anchor="start" fill="#8a8a94" font-size="12.5" font-weight="400">Human decisions are already overturned often (PWDA 2025)</text>
  <line x1="56" y1="356" x2="744" y2="356" stroke="#2a2a32"/>
  <text x="56" y="392" text-anchor="start" fill="#ffffff" font-size="17" font-weight="700">“The NDIS must never reduce us to data points in a secret algorithm.”</text>
  <text x="56" y="416" text-anchor="start" fill="#8a8a94" font-size="12.5" font-weight="400">George Taleporos, Every Australian Counts</text>
  <text x="56" y="444" text-anchor="start" fill="#6a6a74" font-size="12" font-weight="400">Kantianism: people are ends, not inputs  |  ACS 1.2.2 Quality of life</text>
</svg>
