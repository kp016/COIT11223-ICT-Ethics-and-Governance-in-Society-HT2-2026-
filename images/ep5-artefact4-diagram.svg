<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="799" height="429" rx="12" fill="#fbfaf7" stroke="#e3e0d8"/>
  <text x="40" y="54" font-size="23" fill="#1f2328" font-weight="650" text-anchor="start">From a person to a budget</text>
  <text x="40" y="80" font-size="13.5" fill="#5b616b" font-weight="400" text-anchor="start">NDIS needs assessments from mid-2026 (Van Toorn &amp; Dickinson 2025)</text>
  <rect x="40.0" y="108" width="160.5" height="96" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="54.0" y="132" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">THE PERSON</text>
  <text x="54.0" y="156" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Needs support</text>
  <text x="54.0" y="175" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">for daily life</text>
  <line x1="204.5" y1="156.0" x2="216.5" y2="156.0" stroke="#8a8f97" stroke-width="1.5"/>
  <path d="M215.5,152.0 L222.5,156.0 L215.5,160.0" fill="none" stroke="#8a8f97" stroke-width="1.5"/>
  <rect x="226.5" y="108" width="160.5" height="96" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="240.5" y="132" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">ASSESSMENT</text>
  <text x="240.5" y="156" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">A three-hour</text>
  <text x="240.5" y="175" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">interview</text>
  <line x1="391.0" y1="156.0" x2="403.0" y2="156.0" stroke="#8a8f97" stroke-width="1.5"/>
  <path d="M402.0,152.0 L409.0,156.0 L402.0,160.0" fill="none" stroke="#8a8f97" stroke-width="1.5"/>
  <rect x="413.0" y="108" width="160.5" height="96" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="427.0" y="132" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">I-CAN TOOL</text>
  <text x="427.0" y="156" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Scores 12 areas</text>
  <text x="427.0" y="175" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">of daily life</text>
  <line x1="577.5" y1="156.0" x2="589.5" y2="156.0" stroke="#8a8f97" stroke-width="1.5"/>
  <path d="M588.5,152.0 L595.5,156.0 L588.5,160.0" fill="none" stroke="#8a8f97" stroke-width="1.5"/>
  <rect x="599.5" y="108" width="160.5" height="96" rx="8" fill="#edf2f7" stroke="#2f5f8a" stroke-width="1"/>
  <text x="613.5" y="132" font-size="10.5" fill="#8a8f97" font-weight="600" text-anchor="start" letter-spacing="0.8">THE BUDGET</text>
  <text x="613.5" y="156" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">How scores become</text>
  <text x="613.5" y="175" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">a budget is unclear</text>
  <rect x="40" y="224" width="250" height="112" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <text x="60" y="280" font-size="40" fill="#2f5f8a" font-weight="650" text-anchor="start">73%</text>
  <text x="60" y="310" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">of appeals changed the</text>
  <text x="60" y="327" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">decision (PWDA 2025)</text>
  <rect x="306" y="224" width="454" height="112" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/>
  <rect x="306" y="224" width="4" height="112" fill="#2f5f8a"/>
  <text x="326" y="262" font-size="16" fill="#1f2328" font-weight="500" text-anchor="start" font-style="italic">"The NDIS must never reduce us to data</text>
  <text x="326" y="285" font-size="16" fill="#1f2328" font-weight="500" text-anchor="start" font-style="italic">points in a secret algorithm."</text>
  <text x="326" y="318" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">George Taleporos (Van Toorn &amp; Dickinson 2025)</text>
  <line x1="40" y1="370" x2="760" y2="370" stroke="#e3e0d8" stroke-width="1"/>
  <text x="40" y="392" font-size="12.5" fill="#5b616b" font-weight="400" text-anchor="start">Kantianism: people are ends in themselves, never just inputs  |  ACS 1.2.2 Quality of life</text>
